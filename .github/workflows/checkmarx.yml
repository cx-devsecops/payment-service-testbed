name: SSecurity Scans

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  checkmarx-scan:
    runs-on: ubuntu-latest  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkmarx AST Github Action
        uses: Checkmarx/ast-github-action@2.3.45
        with:
          project_name: 'cx-devsecops/payment-service-testbed'
          cx_tenant: ${{ secrets.CX_TENANT_NAME }}
          base_uri: ${{ secrets.CX_BASE_URI }}
          cx_client_id: ${{ secrets.CX_CLIENT_ID }}
          cx_client_secret: ${{ secrets.CX_CLIENT_SECRET }}
          branch: ${{ github.ref }}
          scan_params: '--threshold sscs-secret-detection-critical=1 sscs-secret-detection-high=1 --report-format sarif --report-format sbom'

      # Export results for downstream analysis
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "cx_result.sarif"
          category: "checkmarx-scan-results"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cx_result_sbom.json
          path: '.'