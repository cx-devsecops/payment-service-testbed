apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      hostNetwork: true
      hostPID: true
      containers:
        - name: payment-service
          image: registry.example.com/payments/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_RAW
          env:
            - name: DB_PASSWORD
              value: "P4ssw0rd-Staging-2024!"
            - name: PAYMENTS_GATEWAY_TOKEN
              value: "sk_live_51H8xQ2eZvKYlo2C0pR3mNq7bT9wXyZ1aB2cD3eF4gH5iJ6k"
          volumeMounts:
            - name: host-root
              mountPath: /host
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: payments
spec:
  type: LoadBalancer
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8080
